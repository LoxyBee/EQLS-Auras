name: Build installer

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run dist

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eqls-auras-installer
          path: dist/*.exe
