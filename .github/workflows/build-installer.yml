name: Build installer

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run dist

      # Fixed artifactName in package.json (EQLS-Auras-Setup.exe) means this download URL never
      # changes across version bumps: always
      # github.com/LoxyBee/EQLS-Auras/releases/download/latest-dev/EQLS-Auras-Setup.exe - safe to
      # hand to someone (or something) that just wants to always fetch the current build.
      # prerelease:false (not true) so it's also reachable at the permanent .../releases/latest URL.
      - name: Publish latest installer as a release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest-dev
          name: Latest build
          body: Automatically built from the latest push to master (commit ${{ github.sha }}).
          prerelease: false
          files: dist/*.exe
