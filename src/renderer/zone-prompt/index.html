<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: eqicon:; media-src 'self' eqsound:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Which zone?</title>
  <link rel="stylesheet" href="zone-prompt.css" />
</head>
<body>
  <div id="drag-bar">Which zone?</div>
  <div id="search-row">
    <input type="search" id="zone-search" placeholder="Type to filter..." autocomplete="off" spellcheck="false" />
    <button id="zone-cancel" title="Dismiss">✕</button>
  </div>
  <div id="zone-list"></div>
  <button id="zone-fix-current" title="Opens the 'Where are you now?' picker to correct your current zone.">Wrong current zone? Fix it</button>
  <button id="zone-stop-tracking" title="Clears the destination — the aura goes back to idle.">Stop tracking</button>
  <script src="zone-prompt.js"></script>
</body>
</html>
