<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Move aura</title>
  <link rel="stylesheet" href="move-hud.css" />
</head>
<body>
  <!-- A detached, draggable panel. In 'single' mode (one aura/bar, "Move…") it carries a nudge pad
       and a live x/y readout. In 'all' mode ("Unlock all auras") the nudge arrows live on each
       aura's own blue box instead, so the panel is just the shared step-size / snap controls.
       Body is -webkit-app-region:drag; every control is no-drag. Clamped on-screen (moveHudWindow.js). -->
  <div id="panel" data-mode="single">
    <div class="row head">
      <span id="aura-name">Aura</span>
      <span id="coords"></span>
    </div>

    <div class="row body-row">
      <div id="nudge-pad">
        <button type="button" id="nudge-up" class="nudge" title="Move up">&#9650;</button>
        <button type="button" id="nudge-left" class="nudge" title="Move left">&#9664;</button>
        <button type="button" id="nudge-right" class="nudge" title="Move right">&#9654;</button>
        <button type="button" id="nudge-down" class="nudge" title="Move down">&#9660;</button>
      </div>
      <div id="all-hint" class="hint">Use the &#9650;&#9660;&#9664;&#9654; arrows on each aura's own box to nudge it.</div>
      <div class="controls">
        <div class="row">
          <span class="label">Step</span>
          <button type="button" id="step-1" class="step is-on">1&nbsp;px</button>
          <button type="button" id="step-10" class="step">10&nbsp;px</button>
        </div>
        <div class="row">
          <label class="snap"><input type="checkbox" id="snap-on" /> Snap</label>
          <select id="snap-size">
            <option value="4">4</option>
            <option value="8" selected>8</option>
            <option value="16">16</option>
            <option value="32">32</option>
          </select>
        </div>
      </div>
    </div>

    <div class="row foot">
      <button type="button" id="done" class="primary">Done</button>
      <button type="button" id="reset-pos">Reset position</button>
    </div>
  </div>

  <script src="move-hud.js"></script>
</body>
</html>
