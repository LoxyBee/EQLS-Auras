<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: eqicon:; media-src 'self' eqsound:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Move aura</title>
  <link rel="stylesheet" href="move-hud.css" />
</head>
<body>
  <!-- A detached, draggable panel of SHARED controls (owner's "B1" layout, 16 Oct): captioned
       choice groups, captioned icon buttons, Done on its own at the right. The nudge arrows live in
       a small pad window over each aura's / bar's own box (nudgePadWindow.js). The window shrinks
       to fit this panel (move-hud.js reports its size) and is clamped on screen (moveHudWindow.js).
       Body is -webkit-app-region:drag; every control is no-drag. -->
  <div id="panel" data-mode="single" title="Use the arrows on the box to nudge it">
    <div class="row head">
      <span id="group-link" class="link" style="display:none">&#128279;</span>
      <span id="aura-name">Aura</span>
      <span id="coords"></span>
    </div>

    <div class="row choices">
      <!-- Only for an aura in a linked ("Move together") folder. Switchable mid-move. -->
      <div class="choice" id="group-row" style="display:none">
        <small>Moves</small>
        <div class="seg">
          <button type="button" id="group-mode-group" title="Every aura in the folder moves together"><span class="ico">&#10697;</span>Group</button>
          <button type="button" id="group-mode-single" title="Only this aura moves - the rest stay put"><span class="ico">&#9634;</span>One</button>
        </div>
      </div>
      <div class="choice">
        <small>Step</small>
        <div class="seg">
          <button type="button" id="step-1" class="is-on" title="Each arrow click moves 1 pixel">1</button>
          <button type="button" id="step-10" title="Each arrow click moves 10 pixels">10</button>
        </div>
      </div>
      <div class="choice">
        <small>Grid</small>
        <div class="seg" id="grid-seg">
          <button type="button" data-grid="0" title="No snapping">Off</button>
          <button type="button" data-grid="4" title="Snap to a 4px grid">4</button>
          <button type="button" data-grid="8" title="Snap to an 8px grid">8</button>
          <button type="button" data-grid="16" title="Snap to a 16px grid">16</button>
          <button type="button" data-grid="32" title="Snap to a 32px grid">32</button>
        </div>
      </div>
    </div>

    <div class="row alt-tip" id="alt-tip" style="display:none">Press Alt to move a single aura only</div>

    <div class="row tools centre-row">
      <button type="button" id="centre-h" class="tool" title="Centre on the screen, left to right"><span class="ico">&#8596;</span><small>Centre</small></button>
      <button type="button" id="centre-v" class="tool" title="Centre on the screen, top to bottom"><span class="ico">&#8597;</span><small>Centre</small></button>
    </div>

    <div class="row tools foot">
      <button type="button" id="undo" class="tool" title="Undo (Ctrl+Z)" disabled><span class="ico">&#8630;</span><small>Undo</small></button>
      <button type="button" id="redo" class="tool" title="Redo (Ctrl+Y)" disabled><span class="ico">&#8631;</span><small>Redo</small></button>
      <button type="button" id="reset-pos" class="tool" title="Put this aura back in the default corner"><span class="ico">&#10226;</span><small>Reset</small></button>
      <button type="button" id="done" class="primary">Done</button>
    </div>
  </div>

  <script src="move-hud.js"></script>
</body>
</html>
