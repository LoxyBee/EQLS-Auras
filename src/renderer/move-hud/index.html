<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Move aura</title>
  <link rel="stylesheet" href="move-hud.css" />
</head>
<body>
  <!-- A detached, draggable panel of SHARED controls - step size and snap-to-grid. The nudge
       arrows live in a small pad window sitting over each aura's / bar's own box
       (nudgePadWindow.js), so one aura, one bar, or all of them are positioned the same way. Body
       is -webkit-app-region:drag; every control is no-drag. Clamped on-screen (moveHudWindow.js). -->
  <div id="panel" data-mode="single">
    <div class="row head">
      <span id="aura-name">Aura</span>
      <span id="coords"></span>
    </div>

    <div class="row hint">Use the &#9650;&#9660;&#9664;&#9654; arrows on the box to nudge it.</div>

    <div class="controls">
      <div class="row">
        <span class="label">Step</span>
        <button type="button" id="step-1" class="step is-on">1&nbsp;px</button>
        <button type="button" id="step-10" class="step">10&nbsp;px</button>
      </div>
      <div class="row">
        <label class="snap"><input type="checkbox" id="snap-on" /> Snap</label>
        <select id="snap-size">
          <option value="4">4</option>
          <option value="8" selected>8</option>
          <option value="16">16</option>
          <option value="32">32</option>
        </select>
      </div>
      <div class="row centre-row">
        <span class="label">Centre</span>
        <button type="button" id="centre-h" title="Centre this aura horizontally on the screen">&#8596; across</button>
        <button type="button" id="centre-v" title="Centre this aura vertically on the screen">&#8597; down</button>
      </div>
    </div>

    <div class="row foot">
      <button type="button" id="done" class="primary">Done</button>
      <button type="button" id="reset-pos">Reset position</button>
    </div>
  </div>

  <script src="move-hud.js"></script>
</body>
</html>
