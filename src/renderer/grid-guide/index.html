<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Grid</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #grid {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(240,165,74,0.16) 0 1px, transparent 1px var(--g)),
      repeating-linear-gradient(90deg, rgba(240,165,74,0.16) 0 1px, transparent 1px var(--g));
  }
</style></head>
<body>
  <div id="grid"></div>
  <script>
    const el = document.getElementById('grid');
    window.eqGridGuide.onSize((px) => el.style.setProperty('--g', px + 'px'));
  </script>
</body>
</html>
