<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EQLS Auras Overlay</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="content-wrap">
    <!-- The name is a plain label, not a button - one big drag target, no small no-drag hole. -->
    <div id="drag-overlay" class="drag-overlay">
      <span id="drag-name" class="drag-name"></span>
      <span class="drag-hint">Click and drag to move</span>
      <!-- The nudge arrows are a separate always-on-top pad window centred over this box
           (nudgePadWindow.js) - an empty aura's box is too short to hold them without clipping. -->
    </div>
    <div id="buff-list" class="buff-list"></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
