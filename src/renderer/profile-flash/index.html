<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Loadout</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #flash {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    max-width: 94%;
    padding: 10px 22px;
    border: 1px solid rgba(240, 165, 74, 0.55);
    border-radius: 10px;
    background: rgba(18, 14, 8, 0.82);
    color: #f4e7d2;
    font: 600 22px/1.15 "Segoe UI", system-ui, sans-serif;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    opacity: 0;
  }
  #flash .lead { color: rgba(240, 165, 74, 0.9); font-weight: 700; }
  #flash .cap { font-size: 12px; font-weight: 500; opacity: 0.6; }
  /* fade in fast, hold, fade out - total ~3.55s */
  #flash.play { animation: flash 3550ms ease forwards; }
  @keyframes flash {
    0%   { opacity: 0; transform: translateY(-6px); }
    6%   { opacity: 1; transform: translateY(0); }
    88%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-4px); }
  }
</style></head>
<body>
  <div id="flash"><span class="lead">&#9656;</span><span id="name"></span><span class="cap">loadout</span></div>
  <script src="profile-flash.js"></script>
</body>
</html>
